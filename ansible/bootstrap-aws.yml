---
- name: Prepare Ops Atlas AWS host
  hosts: aws
  become: true

  tasks:
    - name: Install Docker and Git
      ansible.builtin.dnf:
        name:
          - docker
          - git
        state: present

    - name: Start Docker and enable it at boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
