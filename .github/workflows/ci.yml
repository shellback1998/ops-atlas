name: Ops Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check Python syntax
        run: python3 -m py_compile server.py

      - name: Build container image
        run: docker build --tag ops-atlas:ci .

      - name: Test running container and API
        run: |
          docker run --detach --name ops-atlas-ci --publish 127.0.0.1:18080:8080 \
            --env DEPLOYMENT_TARGET=local-docker --env APP_VERSION=ci ops-atlas:ci
          trap 'docker rm --force ops-atlas-ci' EXIT
          python3 - <<'PY'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          base = 'http://127.0.0.1:18080'
          for attempt in range(30):
              try:
                  with urlopen(base + '/api/status', timeout=2) as response:
                      status = json.load(response)
                  break
              except (OSError, URLError):
                  time.sleep(1)
          else:
              raise SystemExit('Application did not become ready within 30 seconds')

          assert status['app'] == 'Ops Atlas', status
          assert status['target'] == 'local-docker', status
          assert status['version'] == 'ci', status
          assert status['hostname'], status
          assert status['time_utc'], status

          with urlopen(base + '/') as response:
              assert b'status.js' in response.read()
          with urlopen(base + '/status.js') as response:
              assert b'/api/status' in response.read()
          print('Container, dashboard, JavaScript, and status API passed')
          PY

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AMD64 and ARM64 image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-k3s:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-image
    runs-on: ubuntu-latest
    concurrency:
      group: ops-atlas-k3s-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join the tailnet as a temporary runner
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ops-atlas-deploy

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4

      - name: Configure restricted K3s access
        shell: bash
        env:
          K3S_CA_B64: ${{ secrets.K3S_CA_B64 }}
          K3S_DEPLOY_TOKEN: ${{ secrets.K3S_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$K3S_CA_B64"
          test -n "$K3S_DEPLOY_TOKEN"
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/ops-atlas.kubeconfig"
          printf '%s' "$K3S_CA_B64" | base64 --decode > "$RUNNER_TEMP/k3s-ca.crt"
          kubectl config set-cluster k3s \
            --server=https://100.106.51.53:6443 \
            --tls-server-name=k8s-manager \
            --certificate-authority="$RUNNER_TEMP/k3s-ca.crt" \
            --embed-certs=true
          kubectl config set-credentials ops-atlas-deployer --token="$K3S_DEPLOY_TOKEN"
          kubectl config set-context ops-atlas \
            --cluster=k3s --user=ops-atlas-deployer --namespace=ops-atlas
          kubectl config use-context ops-atlas
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          kubectl auth can-i patch deployment/ops-atlas -n ops-atlas

      - name: Deploy the image built in this run
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          image="ghcr.io/$REPOSITORY@$IMAGE_DIGEST"
          kubectl -n ops-atlas set image deployment/ops-atlas "web=$image"
          kubectl -n ops-atlas set env deployment/ops-atlas \
            "APP_VERSION=sha-${RELEASE_SHA:0:7}"
          kubectl -n ops-atlas rollout status deployment/ops-atlas --timeout=180s
          kubectl -n ops-atlas get deployment ops-atlas \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Remove temporary Kubernetes credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ops-atlas.kubeconfig" "$RUNNER_TEMP/k3s-ca.crt"

  deploy-aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-image, deploy-k3s]
    runs-on: ubuntu-latest
    concurrency:
      group: ops-atlas-aws-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the deploy script
        uses: actions/checkout@v6

      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::457106204711:role/ops-atlas-github-deploy

      - name: Deploy published image through Systems Manager
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
          INSTANCE_ID: i-054c9cecfd2dbc1a4
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          image="ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST"
          jq -n --arg image "$image" --arg sha "$GITHUB_SHA" \
            --rawfile script scripts/deploy-aws-ssm.sh \
            '{commands: ["IMAGE_REF=" + $image, "RELEASE_SHA=" + $sha, $script]}' \
            > "$RUNNER_TEMP/ops-atlas-ssm-parameters.json"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "Ops Atlas deployment $GITHUB_SHA" \
            --timeout-seconds 300 \
            --parameters "file://$RUNNER_TEMP/ops-atlas-ssm-parameters.json" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: $command_id"
          if ! aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}'

      - name: Remove temporary SSM input
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ops-atlas-ssm-parameters.json"
